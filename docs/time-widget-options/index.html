<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Era · Hours in a day</title>
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				padding: 28px;
				background: #f5f6f3;
				color: #28352f;
				font:
					13px/1.5 'Segoe UI',
					sans-serif;
			}
			main {
				max-width: 800px;
				margin: auto;
			}
			h1 {
				font-size: 20px;
				font-weight: 600;
				margin: 0 0 4px;
			}
			p {
				margin: 0 0 20px;
				color: #626e66;
			}
			.previews {
				display: grid;
				grid-template-columns: minmax(0, 1fr) 264px;
				gap: 20px;
			}
			h2 {
				font-size: 13px;
				font-weight: 600;
				margin: 0 12px 2px;
			}
			iframe {
				width: 100%;
				height: 300px;
				border: 0;
				display: block;
			}
			nav {
				display: flex;
				flex-wrap: wrap;
				gap: 8px 16px;
				margin: 4px 12px 18px;
			}
			a {
				color: #23695b;
				text-underline-offset: 3px;
			}
			a:focus-visible {
				outline: 2px solid #23695b;
				outline-offset: 3px;
			}
			.note {
				margin-left: 12px;
				font-size: 12px;
			}
			@media (max-width: 650px) {
				body {
					padding: 20px 8px;
				}
				.previews {
					grid-template-columns: minmax(0, 1fr);
				}
				h1,
				main > p {
					margin-left: 12px;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Hours in a day</h1>
			<p>One block, six 26px rows. Edit durations directly.</p>
			<div class="previews">
				<section>
					<h2>Day panel</h2>
					<iframe src="block.html" title="Day panel time widgets"></iframe>
				</section>
				<section>
					<h2>Narrow panel</h2>
					<iframe src="block.html" title="Narrow panel time widgets"></iframe>
				</section>
			</div>
			<nav aria-label="Individual designs">
				<a href="phone.html">Phone screen time</a> <a href="gym.html">Gym time</a>
				<a href="reading.html">Reading time</a> <a href="movie.html">Movie time</a>
				<a href="steam.html">Steam game time</a>
			</nav>
			<p class="note">
				Prototype values only. Account integrations and detailed activity data are not defined.
			</p>
		</main>
	</body>
</html>
