<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Era · Reading time</title>
		<style>
			:root {
				font:
					13px 'Segoe UI',
					sans-serif;
				background: #f5f6f3;
				color: #28352f;
				font-synthesis: none;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				padding: 12px;
			}
			.time-block {
				width: 100%;
				border: 1px solid #c2cbc5;
				border-radius: 5px;
				overflow: clip;
			}
			.time-entry {
				--ink: #28352f;
				--muted: #626e66;
				--accent: #23695b;
				color: var(--ink);
				background: #e9ede6;
			}
			.time-entry + .time-entry {
				border-top: 1px solid #ffffff24;
			}
			.time-row {
				display: flex;
				align-items: center;
				gap: 8px;
				height: 26px;
				padding: 2px 7px;
				font-variant-numeric: tabular-nums;
			}
			.activity-icon {
				display: block;
				width: 16px;
				height: 16px;
				flex: 0 0 16px;
				color: var(--accent);
			}
			.duration {
				flex: 0 0 65px;
				display: flex;
				align-items: baseline;
				gap: 3px;
				height: 20px;
			}
			.duration label {
				display: flex;
				align-items: baseline;
				gap: 1px;
			}
			.duration input {
				width: 2ch;
				height: 20px;
				padding: 0;
				border: 0;
				border-radius: 2px;
				background: transparent;
				color: var(--ink);
				font: inherit;
				font-size: 16px;
				line-height: 20px;
				text-align: left;
				font-variant-numeric: tabular-nums;
				appearance: textfield;
				-moz-appearance: textfield;
			}
			.duration .hours {
				width: auto;
				min-width: 1ch;
				max-width: 2ch;
				field-sizing: content;
			}
			.duration span {
				font-size: 10px;
				color: var(--muted);
			}
			input::-webkit-inner-spin-button,
			input::-webkit-outer-spin-button {
				-webkit-appearance: none;
				margin: 0;
			}
			.info {
				display: flex;
				align-items: center;
				justify-content: flex-end;
				flex: 1;
				gap: 5px;
				min-width: 0;
				color: var(--muted);
				font-size: 11px;
			}
			.info input {
				width: 5ch;
				min-width: 0;
				padding: 0;
				border: 0;
				border-radius: 2px;
				background: transparent;
				color: var(--muted);
				font: inherit;
				font-variant-numeric: tabular-nums;
			}
			input:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 0;
			}
			input:invalid {
				outline: 2px solid #db6868;
			}
			.sleep {
				--ink: #f4efdc;
				--muted: #bdcbdc;
				--accent: #e6d399;
				background: #263750;
			}
			.phone {
				--ink: #edeaf5;
				--muted: #beb7d2;
				--accent: #b7abd6;
				background: #393449;
			}
			.gym {
				--ink: #e5efe9;
				--muted: #b4cabe;
				--accent: #a7c9ad;
				background: #334c45;
			}
			.reading {
				--ink: #3f4c3f;
				--muted: #5f715d;
				--accent: #506c4f;
				background: #e5eadc;
			}
			.movie {
				--ink: #f2e8e9;
				--muted: #d2bfc7;
				--accent: #e0b6c4;
				background: #513d49;
			}
			.steam {
				--ink: #ebf4fa;
				--muted: #a9c8dc;
				--accent: #b0d7ed;
				background: #233e52;
			}
		</style>
	</head>
	<body>
		<div class="time-block">
			<section class="time-entry reading" aria-label="Reading time">
				<div class="time-row">
					<svg
						class="activity-icon"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="1.5"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true"
					>
						<path
							d="M12 5c-3-2-6-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-4-1-7-1-10 1Zm0 0v15M5 7h3M5 10h3m8-3h3m-3 3h3"
						/>
					</svg>
					<div class="duration" role="group" aria-label="Reading time">
						<label
							><input
								class="hours"
								type="number"
								aria-label="Reading time hours"
								min="0"
								max="23"
								step="1"
								value="0"
							/><span>h</span></label
						><label
							><input
								class="minutes"
								type="number"
								aria-label="Reading time minutes"
								min="0"
								max="59"
								step="1"
								value="45"
							/><span>m</span></label
						>
					</div>
				</div>
			</section>
		</div>
		<script>
			for (const entry of document.querySelectorAll('.time-entry')) {
				for (const input of entry.querySelectorAll('.duration input')) {
					input.addEventListener('focus', () => input.select());
					input.addEventListener('change', () => {
						if (!input.validity.valid) input.reportValidity();
					});
				}
			}
			// Sleep demonstrates the established linked endpoint behavior.
			const sleep = document.querySelector('.sleep');
			if (sleep) {
				const start = sleep.querySelector('[name=start]'),
					end = sleep.querySelector('[name=end]');
				const hours = sleep.querySelector('.hours'),
					mins = sleep.querySelector('.minutes');
				let startMinutes = 1380,
					endMinutes = 390;
				const fmt = (n) =>
					`${String(Math.floor(n / 60)).padStart(2, '0')}:${String(n % 60).padStart(2, '0')}`;
				for (const field of [start, end]) {
					field.addEventListener('focus', () => field.select());
					field.addEventListener('input', () => field.setCustomValidity(''));
					field.addEventListener('change', () => {
						const m = /^(\d{1,2}):?([0-5]\d)$/.exec(field.value.trim());
						if (!m || +m[1] > 23) {
							field.setCustomValidity('Enter a time from 0000 to 2359.');
							field.reportValidity();
							return;
						}
						const n = +m[1] * 60 + +m[2];
						if (field === start) startMinutes = n;
						else endMinutes = n;
						field.value = fmt(n);
						const duration = (endMinutes - startMinutes + 1440) % 1440;
						hours.value = Math.floor(duration / 60);
						mins.value = String(duration % 60).padStart(2, '0');
					});
				}
				for (const field of [hours, mins])
					field.addEventListener('change', () => {
						if (!hours.value || !mins.value || !hours.validity.valid || !mins.validity.valid)
							return;
						endMinutes = (startMinutes + +hours.value * 60 + +mins.value) % 1440;
						end.value = fmt(endMinutes);
					});
			}
		</script>
	</body>
</html>
