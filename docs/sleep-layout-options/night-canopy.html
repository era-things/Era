<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Era sleep · Night canopy</title>
		<style>
			:root {
				font:
					13px 'Segoe UI',
					sans-serif;
				color: #28352f;
				background: #f5f6f3;
				font-synthesis: none;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				padding: 12px;
			}
			.sleep-widget {
				--ink: #f4efdc;
				--muted: #bdcbdc;
				--gold: #e6d399;
				position: relative;
				isolation: isolate;
				width: 100%;
				min-width: 124px;
				border: 1px solid #4a5d7a;
				border-radius: 5px;
				background: #263750;
				color: var(--ink);
				font-variant-numeric: tabular-nums;
			}
			.sleep-widget > :not(.sky) {
				position: relative;
				z-index: 1;
			}
			.sky {
				position: absolute;
				inset: 0;
				pointer-events: none;
				overflow: hidden;
				border-radius: inherit;
				background:
					radial-gradient(circle at 27% 14%, #e6d3998a 0 0.65px, transparent 1px),
					radial-gradient(circle at 71% 83%, #b7c9e163 0 0.6px, transparent 1px),
					radial-gradient(circle at 89% 19%, #e6d39978 0 0.7px, transparent 1px);
			}
			.sleep-widget input {
				min-width: 0;
				padding: 0;
				border: 0;
				border-radius: 2px;
				background: transparent;
				color: var(--ink);
				font: inherit;
				font-variant-numeric: tabular-nums;
			}
			.duration {
				display: flex;
				align-items: baseline;
				gap: 3px;
				width: max-content;
			}
			.duration label {
				display: flex;
				align-items: baseline;
				gap: 1px;
			}
			.duration input {
				width: 2ch;
				height: 30px;
				font-size: 22px;
				line-height: 30px;
				text-align: right;
				appearance: textfield;
				-moz-appearance: textfield;
			}
			.duration .hours {
				field-sizing: content;
				width: auto;
				min-width: 1ch;
				max-width: 2ch;
			}
			.duration span {
				color: var(--muted);
				font-size: 10px;
			}
			.sleep-widget .time {
				width: 5ch;
				height: 18px;
				color: var(--muted);
				font-size: 11px;
				line-height: 18px;
			}
			.sleep-widget input::-webkit-inner-spin-button,
			.sleep-widget input::-webkit-outer-spin-button {
				-webkit-appearance: none;
				margin: 0;
			}
			.sleep-widget input:focus-visible {
				outline: 2px solid var(--gold);
				outline-offset: 1px;
			}
			.sleep-widget input:invalid {
				outline: 2px solid #ff8c8c;
			}
			.sleep-widget input::placeholder {
				color: var(--muted);
				opacity: 1;
			}
			.icon {
				display: block;
				flex-shrink: 0;
				width: 18px;
				height: 18px;
				color: var(--gold);
			}

			.night-canopy {
				display: grid;
				grid-template-rows: 1fr 18px;
				height: 88px;
				padding: 8px 10px;
			}
			.night-canopy .duration {
				align-self: start;
			}
			.night-canopy > .icon {
				position: absolute;
				top: 10px;
				right: 13px;
				width: 24px;
				height: 24px;
			}
			.night-canopy .endpoints {
				display: flex;
				justify-content: space-between;
			}
			.night-canopy .endpoints .time:last-child {
				text-align: right;
			}
			.night-canopy .horizon {
				position: absolute;
				left: 0;
				right: 0;
				bottom: 24px;
				width: 100%;
				height: 30px;
				color: #9eacc457;
				pointer-events: none;
			}
			.night-canopy .duration input {
				font-size: 25px;
			}
		</style>
	</head>
	<body>
		<section class="sleep-widget night-canopy" aria-label="Sleep">
			<div class="sky" aria-hidden="true"></div>
			<div class="duration" role="group" aria-label="Sleep duration">
				<label
					><input
						class="hours"
						name="hours"
						type="number"
						aria-label="Sleep hours"
						min="0"
						max="23"
						step="1"
						value="7"
						placeholder="—"
					/><span>h</span></label
				><label
					><input
						name="minutes"
						type="number"
						aria-label="Sleep minutes"
						min="0"
						max="59"
						step="1"
						value="30"
						placeholder="—"
					/><span>m</span></label
				>
			</div>
			<svg
				class="icon"
				aria-hidden="true"
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="1.3"
			>
				<path
					d="M17 3a9 9 0 1 0 4 15A9 9 0 0 1 17 3Z"
					fill="currentColor"
					fill-opacity=".12"
				/></svg
			><svg
				class="horizon"
				aria-hidden="true"
				viewBox="0 0 300 30"
				preserveAspectRatio="none"
				fill="none"
				stroke="currentColor"
				stroke-width=".8"
			>
				<path d="M0 23Q60 15 100 21T200 16T300 20M0 29Q60 21 120 26T220 23T300 25" />
				<path d="M12 20Q150-18 288 20" stroke-dasharray="2 5" />
			</svg>
			<div class="endpoints">
				<input
					class="time"
					name="start"
					type="text"
					inputmode="numeric"
					aria-label="Sleep start time"
					maxlength="5"
					value="23:00"
					placeholder="--:--"
					spellcheck="false"
				/><input
					class="time"
					name="end"
					type="text"
					inputmode="numeric"
					aria-label="Sleep wake-up time"
					maxlength="5"
					value="06:30"
					placeholder="--:--"
					spellcheck="false"
				/>
			</div>
		</section>
		<script>
			// Prototype only: local clock intervals under 24 hours; no storage.
			const widget = document.querySelector('.sleep-widget');
			const fields = Object.fromEntries(
				[...widget.querySelectorAll('input')].map((input) => [input.name, input])
			);
			const state = { start: 1380, end: 390, duration: 450 };
			const wrap = (n) => ((n % 1440) + 1440) % 1440;
			const time = (n) =>
				n === null
					? ''
					: `${String(Math.floor(n / 60)).padStart(2, '0')}:${String(n % 60).padStart(2, '0')}`;
			function render() {
				fields.hours.value = state.duration === null ? '' : Math.floor(state.duration / 60);
				fields.minutes.value =
					state.duration === null ? '' : String(state.duration % 60).padStart(2, '0');
				fields.start.value = time(state.start);
				fields.end.value = time(state.end);
			}
			for (const input of Object.values(fields)) {
				input.addEventListener('input', () => input.setCustomValidity(''));
				input.addEventListener('focus', () => input.select());
				input.addEventListener('keydown', (event) => {
					if (event.key === 'Enter') input.blur();
				});
				input.addEventListener('change', () => {
					let field = input.name,
						value = null;
					if (field === 'hours' || field === 'minutes') {
						if (!input.validity.valid) {
							input.reportValidity();
							return;
						}
						if (input.value !== '')
							value =
								field === 'hours'
									? input.valueAsNumber * 60 + ((state.duration ?? 0) % 60)
									: Math.floor((state.duration ?? 0) / 60) * 60 + input.valueAsNumber;
						field = 'duration';
					} else if (input.value.trim()) {
						const match = /^(\d{1,2}):?([0-5]\d)$/.exec(input.value.trim());
						if (!match || +match[1] > 23) {
							input.setCustomValidity('Enter a time from 0000 to 2359.');
							input.reportValidity();
							return;
						}
						value = +match[1] * 60 + +match[2];
					}
					state[field] = value;
					if (value === null) {
						if (field === 'duration') state.end = null;
						else state.duration = null;
					} else if (field === 'duration') {
						if (state.start !== null) state.end = wrap(state.start + value);
						else if (state.end !== null) state.start = wrap(state.end - value);
					} else if (state.start !== null && state.end !== null)
						state.duration = wrap(state.end - state.start);
					else if (state.duration !== null) {
						if (state.start !== null) state.end = wrap(state.start + state.duration);
						else state.start = wrap(state.end - state.duration);
					}
					render();
				});
			}
			render();
		</script>
	</body>
</html>
